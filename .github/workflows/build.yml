name: Build

# Compile on every push and pull request.
# Pushing a tag like v2.0.0 also creates a GitHub release with the .smx attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SourcePawn compiler
        uses: rumblefrog/setup-sp@1b616aebc2c70430364571e2b4ad4b719164c1f7 # v1.3.1
        with:
          version: "1.12.x"

      - name: Compile plugin
        run: |
          mkdir -p build
          spcomp plugin.sp -o build/pistol-only.smx

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pistol-only
          path: build/pistol-only.smx

      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          plugin_version=$(grep -oP '#define PLUGIN_VERSION "\K[^"]+' plugin.sp)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$plugin_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match PLUGIN_VERSION \"$plugin_version\" in plugin.sp"
            exit 1
          fi

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/pistol-only.smx
          generate_release_notes: true
